name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, runner-9d160f62]
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Select or push a version tag such as v0.1.0.' >&2
            exit 1
          fi
          echo "VERSION=${RELEASE_REF#refs/tags/v}" >> "$GITHUB_ENV"
      - name: Test
        run: |
          python3 scripts/test-release.py
          swift test
      - name: Build release app
        run: CONFIGURATION=release ./scripts/build-app.sh
      - name: Smoke test packaged executable
        run: python3 scripts/smoke-host.py .build/release/Comet.app/Contents/MacOS/Comet
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent .build/release/Comet.app .build/Comet-unsigned.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-app
          path: .build/Comet-unsigned.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: [self-hosted, macOS, runner-9d160f62]
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-app
          path: .build
      - name: Resolve Sparkle signing tools
        run: swift package resolve
      - name: Unpack app
        run: ditto -x -k .build/Comet-unsigned.zip .build/release
      - name: Import signing and notarization credentials
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_P12_BASE64:?Missing APPLE_CERTIFICATE_P12_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD}"
          : "${NOTARY_KEY_P8:?Missing APP_STORE_CONNECT_KEY_P8}"
          : "${NOTARY_KEY_ID:?Missing APP_STORE_CONNECT_KEY_ID}"
          : "${NOTARY_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID}"
          : "${SIGNING_IDENTITY:?Missing APPLE_SIGNING_IDENTITY variable}"
          umask 077
          keychain="$RUNNER_TEMP/comet-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/comet-certificate.p12"
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/comet-notary.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/comet-certificate.p12" -P "$CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain"
          xcrun notarytool store-credentials comet-notary --keychain "$keychain" \
            --key "$RUNNER_TEMP/comet-notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm -f "$RUNNER_TEMP/comet-certificate.p12" "$RUNNER_TEMP/comet-notary.p8"
      - name: Sign, notarize, and create DMG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          SIGNING_KEYCHAIN: ${{ runner.temp }}/comet-signing.keychain-db
          NOTARY_PROFILE: comet-notary
          NOTARY_KEYCHAIN: ${{ runner.temp }}/comet-signing.keychain-db
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: VERSION="${RELEASE_TAG#v}" ./scripts/release.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "Comet ${RELEASE_TAG#v}" \
            --generate-notes .build/dist/Comet.dmg .build/dist/appcast.xml .build/dist/SHA256SUMS
      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/comet-certificate.p12" "$RUNNER_TEMP/comet-notary.p8"
          if [[ -f "$RUNNER_TEMP/comet-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/comet-signing.keychain-db"
          fi
